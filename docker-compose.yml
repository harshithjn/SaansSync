version: '3.8'

services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: saanssync
      POSTGRES_PASSWORD: saanssync_password
      POSTGRES_DB: saanssync_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - DATABASE_URL=postgresql://saanssync:saanssync_password@db:5432/saanssync_db
    depends_on:
      - db
    restart: always

volumes:
  pgdata:

